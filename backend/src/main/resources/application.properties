spring.application.name=backend
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}

# ---------- 数据源（仅本地开发；密码为 compose 默认值，见 DECISIONS D-07） ----------
# 上线走环境变量注入，见 DECISIONS D-12
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA：表结构由 sql/schema.sql 管理，禁止 Hibernate 改表（见 DECISIONS D-18） ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------- Redis（docker-compose 起的 mian-redis） ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.data.redis.password=${REDIS_PASSWORD:}
spring.sql.init.mode=never
server.error.include-message=never
server.tomcat.max-http-form-post-size=16KB
spring.web.resources.static-locations=file:../frontend/dist/,classpath:/static/
spring.web.resources.cache.period=0
game.minute-ms=${GAME_MINUTE_MS:60000}
game.presence-ms=${GAME_QUEUE_TIMEOUT_MS:45000}
game.icp=${ICP_NUMBER:\u82cfICP\u59072026094154\u53f7-1}
game.police-number=${POLICE_NUMBER:}
game.police-url=${POLICE_URL:}
