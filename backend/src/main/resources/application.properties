spring.application.name=backend
server.port=8080

# ---------- 数据源（仅本地开发；密码为 compose 默认值，见 DECISIONS D-07） ----------
# 上线走环境变量注入，见 DECISIONS D-12
spring.datasource.url=jdbc:mysql://localhost:3306/mian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA：表结构由 sql/schema.sql 管理，禁止 Hibernate 改表（见 DECISIONS D-18） ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------- Redis（docker-compose 起的 mian-redis） ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
