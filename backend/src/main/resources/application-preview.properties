# Explicit standalone preview only. Default application remains the team's MySQL/Redis setup.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/echo;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/preview-schema.sql
